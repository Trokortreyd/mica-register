name: MiCA-Register aktualisieren

on:
  schedule:
    - cron: "17 5 * * *"   # täglich 05:17 UTC (06:17/07:17 Wien)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CSVs laden und Datenbank aktualisieren
        run: python scripts/update.py
      - name: Änderungen committen
        run: |
          git config user.name "mica-register-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A docs data
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Update $(date -u +%Y-%m-%d)"
            git push
          fi
